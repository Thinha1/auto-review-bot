services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/auto_review.db
    volumes:
      - review-data:/data

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/auto_review.db
    ports:
      - "8000:8000"
    volumes:
      - review-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/auto_review.db
    volumes:
      - review-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  review-data:
