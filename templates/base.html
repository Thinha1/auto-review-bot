<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PR Review Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="shell header">
      <a class="brand" href="/dashboard">PR Review Agent</a>
      {% if user %}<span class="muted">Signed in as {{ user }}</span>{% endif %}
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
