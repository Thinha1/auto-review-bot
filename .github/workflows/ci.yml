name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Migrations on empty database
        run: |
          export DATABASE_URL="sqlite:///./.ci-empty.db"
          uv run alembic upgrade head
          uv run alembic current
          rm -f ./.ci-empty.db

      - name: Tests
        run: uv run pytest -q
